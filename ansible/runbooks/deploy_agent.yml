---
- name: Deploy InfraRescue monitoring agent
  hosts: all
  become: true

  tasks:
    - name: Create InfraRescue agent directory
      ansible.builtin.file:
        path: /opt/infrarescue/agent
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Create incidents directory
      ansible.builtin.file:
        path: /opt/infrarescue/incidents
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy InfraRescue agent files
      ansible.builtin.copy:
        src: ../../agent/
        dest: /opt/infrarescue/agent/
        owner: ec2-user
        group: ec2-user
        mode: "0644"

    - name: Create InfraRescue recovery runbooks directory
      ansible.builtin.file:
        path: /opt/infrarescue/runbooks
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy Docker recovery runbook
      ansible.builtin.copy:
        src: start_docker.yml
        dest: /opt/infrarescue/runbooks/start_docker.yml
        owner: root
        group: root
        mode: "0644"
