---
- name: Deploy InfraRescue application
  hosts: all
  become: true

  tasks:
    - name: Create InfraRescue application directory
      ansible.builtin.file:
        path: /opt/infrarescue
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: ../../app/
        dest: /opt/infrarescue/app/
        owner: ec2-user
        group: ec2-user

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ../../docker-compose.yml
        dest: /opt/infrarescue/docker-compose.yml
        owner: ec2-user
        group: ec2-user

    - name: Build InfraRescue Docker image
      ansible.builtin.command:
        cmd: docker compose build
        chdir: /opt/infrarescue
      become_user: ec2-user

    - name: Start InfraRescue application
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/infrarescue
      become_user: ec2-user
